<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ d.open }}" style="display:flex; flex-direction:column; gap:10px; padding:10px 10px 12px; border-radius:22px; background:#fff; box-shadow:0 2px 0 #FFE8DE, 0 10px 30px rgba(255,90,31,.10); cursor:pointer; font-family:'Be Vietnam Pro', system-ui; color:#1A1712;" style-hover="transform:translateY(-3px); box-shadow:0 2px 0 #FFCDB8, 0 16px 36px rgba(255,90,31,.18);">
  <div style="position:relative; aspect-ratio:1; width:100%; border-radius:16px; overflow:hidden; background:#FFF3EC;">
    <img src="{{ d.src }}" alt="" style="width:100%; height:100%; object-fit:cover; display:block;">
    <span style="position:absolute; top:10px; left:10px; padding:6px 9px; border-radius:99px; background:#FFD98F; font:800 12px/1 'Be Vietnam Pro';">{{ d.off }}</span>
  </div>
  <div style="padding:0 4px; display:flex; flex-direction:column; gap:8px;">
    <span style="font:600 11px/1 'Be Vietnam Pro'; color:#8B8378;">{{ d.san }} · {{ d.sold }}</span>
    <div style="font:500 14px/1.35 'Be Vietnam Pro'; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:38px;">{{ d.name }}</div>
    <div style="display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;"><span style="font:800 18px/1 'Bricolage Grotesque'; color:#FF5A1F;">{{ d.price }}</span><span style="font:400 12px/1 'Be Vietnam Pro'; color:#8B8378; text-decoration:line-through;">{{ d.old }}</span></div>
    <span style="text-align:center; padding:10px; border-radius:12px; background:#FF5A1F; color:#fff; font:800 13px/1 'Be Vietnam Pro';">Hoàn {{ d.cash }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:380},&quot;d&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;src&quot;:&quot;img/tile-1.jpg&quot;,&quot;san&quot;:&quot;Shopee&quot;,&quot;sold&quot;:&quot;Đã bán 2,3k&quot;,&quot;name&quot;:&quot;Máy hút bụi cầm tay không dây mini 2 trong 1&quot;,&quot;price&quot;:&quot;259.000₫&quot;,&quot;old&quot;:&quot;399.000₫&quot;,&quot;off&quot;:&quot;-35%&quot;,&quot;cash&quot;:&quot;17.600₫&quot;},&quot;tsType&quot;:&quot;{src:string; san:string; sold:string; name:string; price:string; old:string; off:string; cash:string; open?:()=&gt;void}&quot;}}"></script>
</body>
</html>
